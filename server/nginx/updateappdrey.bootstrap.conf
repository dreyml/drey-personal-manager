# Use este host temporariamente, apenas para emitir o primeiro certificado TLS.
server {
    listen 80;
    listen [::]:80;
    server_name updateappdrey.nxuslab.com;

    root /var/www/updateappdrey;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
