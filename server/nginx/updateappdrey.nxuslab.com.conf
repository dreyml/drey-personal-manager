# Virtual Host exclusivo do Drey Manager.
# Não use `default_server`: os sites existentes continuam atendidos pelos próprios hosts.

server {
    listen 80;
    listen [::]:80;
    server_name updateappdrey.nxuslab.com;

    # Necessário para emitir/renovar o certificado TLS via Certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/updateappdrey;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name updateappdrey.nxuslab.com;

    # Ajuste apenas se o Certbot usar um caminho diferente no seu servidor.
    ssl_certificate /etc/letsencrypt/live/updateappdrey.nxuslab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updateappdrey.nxuslab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/updateappdrey;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # O app consulta este arquivo na inicialização. Nunca o deixe em cache.
    location = /manifest.json {
        default_type application/json;
        try_files /manifest.json =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # APKs publicados manualmente pelo responsável pelo servidor.
    location /downloads/ {
        try_files $uri =404;
        types {
            application/vnd.android.package-archive apk;
        }
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # O endpoint só expõe manifesto, downloads e o desafio ACME.
    location / {
        return 404;
    }
}
